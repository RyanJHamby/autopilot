# Per-repo autopilot config. Owned by Ryan; agents cannot edit it (CODEOWNERS + guard + deny rules).
# Edit from your phone in the GitHub mobile editor to change mode, tier or limits.
tier: B              # A career-critical | B useful | C low
mode: standard              # standard | yolo | dormant
comms: none                 # fixed in v1; there is no code path that raises this

# Commands agents may run (also the Bash allowlist). Add test/lint runners here.
commands:
  - "uv run"
  - "uv sync"
  - "pytest"
  - "ruff"
  - "python"
  - "npm"

# What the off-Actions executor (apx) runs as this repo's CI, in order, stopping at the first failure. Mirrors
# .github/workflows/ci.yml. Read from the default branch only. Distinct from `commands:` above (the agent's tool allowlist).
ci:
  - "uv sync --quiet"
  - "uv run ruff check ."
  - "uv run pytest -q"
  - {run: "npm ci --ignore-scripts", dir: "apps/control-plane"}
  - {run: "npm run typecheck", dir: "apps/control-plane"}
  - {run: "npm test", dir: "apps/control-plane"}

guard:
  max_diff_lines: 800
  extra_protected:           # the guard path: agents never edit the system that constrains them
    - kit/runtime/**
    - kit/workflows/**
    - kit/callers/**
    - kit/agents/**
    - policy/**
    - specs/_TEMPLATE.md
    - apps/control-plane/proxy.ts
    - apps/control-plane/lib/auth.ts
    - apps/control-plane/lib/githubApp.ts
    - apps/control-plane/lib/levers.ts
    - apps/control-plane/lib/ledger.ts
    - apps/control-plane/lib/task.ts
    - apps/control-plane/lib/triage.ts
    - apps/control-plane/lib/triage-run.ts
    - apps/control-plane/app/api/**
    - apps/control-plane/supabase/**
    - apps/control-plane/github-app/**
    - src/autopilot/picker.py
  comms_allow:             # this repo writes and tests the guard itself, so its journal and guard tests must be able to name the commands the guard forbids
    - docs/journal.md
    - tests/test_guard.py
    - tests/test_proposer.py           # path globs where messaging libs are legitimately part of the product

# budget:                   # optional overrides of policy defaults
#   runs_per_day: {A: 2, B: 1}
#   max_turns: {standard: 25}
