# autopilot-managed thin caller. Weekly audit: files a few small issues that serve the repo charter, within its caps.
name: audit

on:
  schedule:
    - cron: "43 11 * * 1"     # Mondays, ~07:43 ET
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    permissions:
      contents: read
      issues: write
      id-token: write
    uses: RyanJHamby/autopilot-kit/.github/workflows/audit.yml@834254acdc32d0e8b6dc4178e8fb693d75305f3f
    with:
      kit_repo: RyanJHamby/autopilot-kit
      kit_ref: 834254acdc32d0e8b6dc4178e8fb693d75305f3f
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
