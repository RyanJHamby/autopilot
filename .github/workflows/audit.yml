# autopilot-managed thin caller. Weekly audit: files a few small issues that serve the repo charter, within its caps.
name: audit

on:
  schedule:
    - cron: "43 11 * * 1"     # Mondays, ~07:43 ET
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    permissions:
      contents: read
      issues: write
      id-token: write
    uses: RyanJHamby/autopilot-kit/.github/workflows/audit.yml@20364121a5f10e67e0c5e0b4d30994b90e7582ca
    with:
      kit_repo: RyanJHamby/autopilot-kit
      kit_ref: 20364121a5f10e67e0c5e0b4d30994b90e7582ca
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
