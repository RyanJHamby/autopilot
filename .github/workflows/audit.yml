# autopilot-managed thin caller. Weekly audit: files a few small issues that serve the repo charter, within its caps.
name: audit

on:
  schedule:
    - cron: "43 11 * * 1"     # Mondays, ~07:43 ET
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    permissions:
      contents: read
      issues: write
      id-token: write
    uses: RyanJHamby/autopilot-kit/.github/workflows/audit.yml@c5f0fd0cf391dac3005af06b18035311cb2f1339
    with:
      kit_repo: RyanJHamby/autopilot-kit
      kit_ref: c5f0fd0cf391dac3005af06b18035311cb2f1339
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
