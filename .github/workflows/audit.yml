# autopilot-managed thin caller. Weekly audit: files a few small issues that serve the repo charter, within its caps.
name: audit

on:
  schedule:
    - cron: "43 11 * * 1"     # Mondays, ~07:43 ET
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    permissions:
      contents: read
      issues: write
      id-token: write
    uses: RyanJHamby/autopilot-kit/.github/workflows/audit.yml@724e0f230637a957c26d9e87835ac679ddf19a08
    with:
      kit_repo: RyanJHamby/autopilot-kit
      kit_ref: 724e0f230637a957c26d9e87835ac679ddf19a08
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
