# autopilot-managed thin caller. Weekly audit: files a few small issues that serve the repo charter, within its caps.
name: audit

on:
  schedule:
    - cron: "43 11 * * 1"     # Mondays, ~07:43 ET
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    permissions:
      contents: read
      issues: write
      id-token: write
    uses: RyanJHamby/autopilot-kit/.github/workflows/audit.yml@72a6b1c7928faaa7ff3d7d94afcb1a505442fe1a
    with:
      kit_repo: RyanJHamby/autopilot-kit
      kit_ref: 72a6b1c7928faaa7ff3d7d94afcb1a505442fe1a
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
