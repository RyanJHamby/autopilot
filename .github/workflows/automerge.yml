# autopilot-managed thin caller. Merges only PRs your .autopilot/merge-policy.yaml has opted in (ships empty = never).
name: automerge

on:
  workflow_run:
    workflows: ["guard", "ci", "test", "build"]
    types: [completed]
  schedule:
    - cron: "17 */3 * * *"   # sweep: catches PRs whose last check finished after the guard run
  workflow_dispatch:

permissions: {}

jobs:
  automerge:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read
    uses: RyanJHamby/autopilot-kit/.github/workflows/automerge.yml@3473f9dad45ca3afc32a4f06574bff71b60eacbc
    with:
      kit_repo: RyanJHamby/autopilot-kit
      kit_ref: 3473f9dad45ca3afc32a4f06574bff71b60eacbc
