# autopilot-managed thin caller. Merges only PRs your .autopilot/merge-policy.yaml has opted in (ships empty = never).
name: automerge

on:
  workflow_run:
    workflows: ["guard", "ci", "test", "build"]
    types: [completed]
  schedule:
    - cron: "17 */3 * * *"   # sweep: catches PRs whose last check finished after the guard run
  workflow_dispatch:

permissions: {}

jobs:
  automerge:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read
    uses: RyanJHamby/autopilot-kit/.github/workflows/automerge.yml@2d0c2ef585ee7bd8c90e24da524ee826b84358a4
    with:
      kit_repo: RyanJHamby/autopilot-kit
      kit_ref: 2d0c2ef585ee7bd8c90e24da524ee826b84358a4
