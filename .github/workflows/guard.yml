# autopilot-managed thin caller. The logic lives in the pinned kit; change it by bumping the sha below (a PR you merge).
name: guard

on:
  pull_request:
  push:
    branches: ["agent/**"]   # agent pushes use a token that does not fire pull_request CI; this satisfies required checks

permissions: {}

jobs:
  guard:
    permissions:
      contents: read
    uses: RyanJHamby/autopilot-kit/.github/workflows/guard.yml@5d64489412b23ccdc1932320e3fb34f7944fcdfe
    with:
      kit_repo: RyanJHamby/autopilot-kit
      kit_ref: 5d64489412b23ccdc1932320e3fb34f7944fcdfe
