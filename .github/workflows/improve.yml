# autopilot-managed thin caller. Weekly retro: repeated failures become reviewed lessons for future agent runs.
name: improve

on:
  schedule:
    - cron: "11 12 * * 0"     # Sundays, ~08:11 ET
  workflow_dispatch:

permissions: {}

jobs:
  improve:
    permissions:
      contents: write
      pull-requests: write
      issues: read
      actions: read
      id-token: write
    uses: RyanJHamby/autopilot-kit/.github/workflows/improve.yml@72a6b1c7928faaa7ff3d7d94afcb1a505442fe1a
    with:
      kit_repo: RyanJHamby/autopilot-kit
      kit_ref: 72a6b1c7928faaa7ff3d7d94afcb1a505442fe1a
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
