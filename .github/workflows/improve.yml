# autopilot-managed thin caller. Weekly retro: repeated failures become reviewed lessons for future agent runs.
name: improve

on:
  schedule:
    - cron: "11 12 * * 0"     # Sundays, ~08:11 ET
  workflow_dispatch:

permissions: {}

jobs:
  improve:
    permissions:
      contents: write
      pull-requests: write
      issues: read
      actions: read
      id-token: write
    uses: RyanJHamby/autopilot-kit/.github/workflows/improve.yml@20c8b03bdc4f93e5e964f4ed15d93351eb9006d7
    with:
      kit_repo: RyanJHamby/autopilot-kit
      kit_ref: 20c8b03bdc4f93e5e964f4ed15d93351eb9006d7
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
