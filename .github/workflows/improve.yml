# autopilot-managed thin caller. Weekly retro: repeated failures become reviewed lessons for future agent runs.
name: improve

on:
  schedule:
    - cron: "11 12 * * 0"     # Sundays, ~08:11 ET
  workflow_dispatch:

permissions: {}

jobs:
  improve:
    permissions:
      contents: write
      pull-requests: write
      issues: read
      actions: read
      id-token: write
    uses: RyanJHamby/autopilot-kit/.github/workflows/improve.yml@20364121a5f10e67e0c5e0b4d30994b90e7582ca
    with:
      kit_repo: RyanJHamby/autopilot-kit
      kit_ref: 20364121a5f10e67e0c5e0b4d30994b90e7582ca
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
