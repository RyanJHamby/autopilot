# Red-team probe (manual): proves whether a workflow running from a NON-default branch can read the Claude token.
# Run it from a throwaway branch: `gh workflow run redteam-secrets.yml --ref redteam/probe`.
# Expected after the Environment migration: `repo_secret_visible` = false and `env_job` is refused by the main-only branch policy.
# It only ever prints a boolean, never the value.
name: redteam-secrets

on:
  workflow_dispatch:

permissions: {}

jobs:
  repo_secret_visible:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: can this branch read the repo-level token?
        env:
          T: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$T" ]; then echo "LEAK: repo-level CLAUDE_CODE_OAUTH_TOKEN is readable from ${GITHUB_REF}"; exit 1; fi
          echo "ok: not readable from ${GITHUB_REF}"

  env_job:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: autopilot-exec
    steps:
      - name: should never start off the default branch
        run: echo "LEAK: environment job started from ${GITHUB_REF}"; exit 1
