# Source of truth for which repos autopilot manages.
# tier  A = career-critical, gets the most budget; B = useful proof repos; C = low priority
# mode  standard | yolo | dormant   (dormant = scaffolded but off)
# comms is always "none" in v1; there is no code path that raises it.

owner: RyanJHamby

defaults:
  models:           # aliases, never pinned ids
    triage: haiku
    default: sonnet
    hard: opus
  effort:
    triage: low
    default: medium
    hard: high
  max_turns:
    standard: 25
    yolo: 60
    hard: 30
    triage: 5
    reviewer: 10
  runs_per_day:     # per repo, rolling 24h; sum over wave 1 stays under the global cap
    A: 2
    B: 1
    C: 0
  hard_runs_per_day: 1      # opus, tier A only
  global_runs_per_day: 12
  max_open_agent_prs: 3
  breaker_failures: 2       # consecutive failed runs before the repo auto-disables

repos:
  # --- wave 1 (only drillpad-workspace and stencil are active; the rest are on hold by the owner, 2026-10-16) ---
  drillpad-workspace:      {tier: A, mode: standard, enabled: true}
  fillcast:                {tier: A, mode: standard, enabled: false, needs_repo: true}
  order-book-engine:       {tier: A, mode: standard, enabled: false}
  tokenomics-bench:        {tier: B, mode: standard, enabled: false}
  stock-screener:          {tier: B, mode: standard, enabled: false}
  drillpad:                {tier: B, mode: standard, enabled: false, public: true}

  # --- dormant scaffold (files only, workflows gated off) ---
  claude-docs:             {tier: C, mode: dormant, enabled: false}
  resume:                  {tier: C, mode: dormant, enabled: false}
  RyanJHamby.github.io:    {tier: C, mode: dormant, enabled: false, public: true}
  FlowState:               {tier: C, mode: dormant, enabled: false, public: true}
  lift_app:                {tier: C, mode: dormant, enabled: false}
  stencil:               {tier: A, mode: standard, enabled: true, hold_until: "2026-10-16T21:00:00Z"}  # owner pause until 5pm ET

# Never scaffolded: upstream forks and sunset projects. Add to this list to refuse `ap init`.
excluded:
  - firecracker
  - vllm
  - gis-analysis-checker-zonevex
  - gis-analysis-checker
  - ahj-linter-rule-engine
  - ahj-linter-api-gateway
  - ahj-linter-frontend
