[project]
name = "autopilot"
version = "0.1.0"
description = "Async agent system: scaffolds, guards, budget gate and spec handshake for GitHub repos"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.scripts]
ap = "autopilot.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autopilot"]

[tool.pytest.ini_options]
pythonpath = ["kit/runtime", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E731", "E702"]
