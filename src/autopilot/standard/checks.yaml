# The project standard, version 1. Each rule says how it is backed; see autopilot/standard/__init__.py.
# `enforced` means the ci.yml step `uv run ap standard check . --offline` blocks a merge on that rule's failure.
# Agents must not edit this file. It is in guard.extra_protected.

standard_version: 1

checks:
  # Audited rules: reported by `ap standard check`. `ap doctor` also runs pinned-actions, secret-exposed-workflows and thin-claude-md.
  - id: pinned-actions
    title: Every action in a workflow is pinned to a commit SHA
    level: fail
    label: enforced
    enforced_by: "ci.yml step `uv run ap standard check . --offline`"
    why: A tag can be moved after you reviewed it. A commit SHA can't.
    fix: Replace the tag with the 40-character commit SHA, and keep the version as a trailing comment.

  - id: workflow-permissions
    title: Every workflow sets top-level `permissions`
    level: fail
    label: enforced
    enforced_by: "ci.yml step `uv run ap standard check . --offline`"
    why: Without it, jobs get the repository's default token scope, which is usually wider than they need.
    fix: "Add `permissions:` with `contents: read` at the top of the workflow, and widen it per job only where needed."

  - id: no-privileged-triggers
    title: No workflow uses `pull_request_target`
    level: fail
    label: enforced
    enforced_by: "ci.yml step `uv run ap standard check . --offline`"
    why: It runs code from a pull request with the repository's secrets in reach.
    fix: Use `pull_request`, or move the privileged step into a separate trusted workflow.

  - id: secret-exposed-workflows
    title: Workflows that use repo secrets on pull requests exclude agent branches
    level: fail
    label: enforced
    enforced_by: "ci.yml step `uv run ap standard check . --offline`"
    why: An agent PR could read or spend a secret that a workflow hands to PR code.
    fix: Exclude `agent/*` branches from the workflow, or stop passing the secret to PR code.

  - id: codeowners-cover-protected-paths
    title: CODEOWNERS covers every protected path
    level: fail
    label: enforced
    enforced_by: "ci.yml step `uv run ap standard check . --offline`"
    why: A protected path with no owner can be changed by whoever opens the pull request.
    fix: Add a CODEOWNERS entry for each protected path, naming a human.

  - id: no-tracked-secrets
    title: No secrets file is tracked by git
    level: fail
    label: enforced
    enforced_by: "ci.yml step `uv run ap standard check . --offline`"
    why: Git history is hard to erase, and a committed key stays exposed until it is rotated.
    fix: Remove the file from git, rotate whatever it held, and add it to `.gitignore`.

  - id: thin-claude-md
    title: CLAUDE.md imports AGENTS.md
    level: warn
    label: audited
    why: Keeping instructions in AGENTS.md lets you switch coding agents without rewriting them.
    fix: Make CLAUDE.md contain `@AGENTS.md` and nothing else of substance.

  - id: one-check-entrypoint
    title: There is one command that runs the repo's checks
    level: warn
    label: audited
    why: If local and CI checks differ, a green local run proves little.
    fix: Add a `check` target to a Makefile, or list the CI commands under `ci:` in `.autopilot/repo.yaml`.

  - id: license-present
    title: Public repos have a LICENSE
    level: warn
    label: audited
    applies_to: public
    why: Without a license, nobody else may legally use or build on the code.
    fix: Add a LICENSE file.

  - id: ruleset-present
    title: The default branch has a ruleset
    level: warn
    label: audited
    why: Branch rules are what make checks binding. Without them a failing check cannot block a merge.
    fix: Apply the ruleset with `ap ruleset REPO --apply`. Result is `unknown` if the ruleset can't be read.

  # Day-0 rules, `since: 2026-11-10`: strict for a repo whose first commit is on or after that date, grandfathered to warn for an
  # older one (see STANDARD.md, "Phasing a rule in"). They audit wiring only: that a hook, a scan and a cooldown are set up, not
  # that a scan catches anything. A repo made by `ap new` already passes all four.
  - id: hook-wired
    title: A pre-commit hook runs make, and `make setup` installs it
    level: fail
    label: enforced
    since: 2026-11-10
    enforced_by: "ci.yml step `uv run ap standard check . --offline`"
    why: A hook cannot be forced onto a clone. Without a `setup` target a fresh clone, including an agent's, commits with no checks.
    fix: Add `.githooks/pre-commit` (executable) that runs `make quick`, and a `setup` target that symlinks it into .git/hooks.

  - id: secret-scan-wired
    title: A secret scan (gitleaks) is wired into the Makefile or pre-commit config
    level: fail
    label: enforced
    since: 2026-11-10
    enforced_by: "ci.yml step `uv run ap standard check . --offline`"
    why: Agents and people paste keys into code and logs, and a leaked key is the most common way a small account is taken over.
    fix: Add a `staged-secrets` target running `gitleaks git --staged`, and call it from `quick`.

  - id: workflow-lint-wired
    title: actionlint and zizmor run on the workflows
    level: fail
    label: enforced
    since: 2026-11-10
    enforced_by: "ci.yml step `uv run ap standard check . --offline`"
    why: Workflow files are code that runs with your credentials, and a PR title interpolated into a shell step is an injection.
    fix: Add a `workflow-lint` target that runs actionlint and zizmor on .github/workflows, and call it from `check`.

  - id: dependency-cooldown
    title: Dependency updates wait a few days before they are proposed
    level: fail
    label: enforced
    since: 2026-11-10
    enforced_by: "ci.yml step `uv run ap standard check . --offline`"
    why: Most malicious package releases are caught and pulled within days, so a version a week old is far less likely to be one.
    fix: "Add `cooldown: {default-days: 7}` to every Dependabot entry, or set `minimumReleaseAge` in Renovate."

  - id: install-scripts-off
    title: A node repo does not let installed packages run install scripts
    level: warn
    label: audited
    why: Install scripts run arbitrary code from every dependency, on every machine that installs, before anyone has read it. Turning them off removes the most common way a poisoned package gets in.
    fix: "Add `ignore-scripts=true` to .npmrc (or `enableScripts: false` to .yarnrc.yml), then run the install and the tests. A package that really needs a build step can be rebuilt by name afterwards."

  - id: standard-wired
    title: "`make check` runs the standard, so a new capability is noticed"
    level: fail
    label: enforced
    since: 2026-11-10
    enforced_by: "ci.yml step `uv run ap standard check . --offline`"
    why: The capability packs only help if something that runs on every change calls them, or a repo can ship Stripe code with nothing said.
    fix: "Add a `standard` target running `ap standard check . --offline` and make `check` depend on it; `quick` should call `standard-report`."

  - id: ui-no-vibe-tells
    title: UI source avoids the banned vibe-coded tells and pastel colors (STANDARD.md "UI and landing pages")
    level: fail
    label: enforced
    since: 2026-11-11
    enforced_by: "ci.yml step `uv run ap standard check . --offline`"
    why: Agents build UIs without being asked and drift to the same look every time (pastels, gradients, Inter, Lucide, em dashes, three-card rows). An instruction can be missed; a failing check can't. A repo with no UI source skips.
    fix: "Fix each finding, or add a dated waiver in policy/waivers.yaml for a deliberate exception and record why in docs/journal.md. This is a pattern match over source: it sees fonts, icon packages, colors, utility classes and em dashes, not layout or whether a testimonial is real."

  # Capability packs, `since: 2026-11-10`. A repo that can take payments, call an LLM or run a deployment must have that capability's
  # pack (see packs.yaml). The capability is read from the repo's own content, so the requirement appears when the capability does.
  # Code items are checked against the code. Record items are SELF-ATTESTED: the repo can hold a note that a spend cap exists, not
  # prove it. A dated record goes stale after 180 days. Nothing here can tell a real record from a plausible one.
  - id: payments-pack
    title: A repo that takes payments has the payments pack (signature check, event dedupe, threat model, terms, owned billing paths)
    level: fail
    label: enforced
    since: 2026-11-10
    enforced_by: "ci.yml step `uv run ap standard check . --offline`"
    why: Taking money is where a missing webhook check, a replayed event or an unowned billing route costs real money and trust.
    fix: "Add each missing item the finding names; `packs.yaml` says exactly what satisfies it. Records are self-attested."

  - id: llm-pack
    title: A hosted repo that calls an LLM has the LLM pack (spend cap record, kill switch, per-user limit, evals)
    level: fail
    label: enforced
    since: 2026-11-10
    enforced_by: "ci.yml step `uv run ap standard check . --offline`"
    why: An LLM call is the one line of code that spends money per request, so a runaway loop or a free account can become a large bill.
    fix: "Add each missing item the finding names. Only a deployed repo with users or payments owes the cap, kill switch and evals. Records are self-attested."

  - id: deploy-pack
    title: A deployed repo has the deploy pack (health endpoint, error tracking, rollback runbook)
    level: fail
    label: enforced
    since: 2026-11-10
    enforced_by: "ci.yml step `uv run ap standard check . --offline`"
    why: You should hear about a broken deploy before a user tells you, and know how to undo it.
    fix: "Add each missing item the finding names. Records are self-attested."

  - id: db-pack
    title: A repo with a database has the DB pack (a tested-backup record, a migration runbook, a threat model)
    level: fail
    label: enforced
    since: 2026-11-10
    enforced_by: "ci.yml step `uv run ap standard check . --offline`"
    why: A database with no backup anyone has restored, and no written way to change its schema, is the failure that is worst to find out about late.
    fix: "Add each missing item the finding names; `packs.yaml` says exactly what satisfies it. Records are self-attested, and the backup record goes stale after 180 days."

  # Advisory rules: judgment. They warn and never fail a run, and nothing here claims they improve outcomes.
  - id: agents-md-budget
    title: AGENTS.md is 60 lines or fewer
    level: warn
    label: advisory
    evidence: judgment
    why: Every always-loaded line costs tokens each session. Whether shorter files help agents is unproven.
    fix: Move detail into a skill or a note that is only read when needed.

  - id: how-this-was-built
    title: README has an accurate "How this was built" section
    level: warn
    label: advisory
    evidence: judgment
    why: Public claims about authorship should match what happened. Accuracy needs a human to judge.
    fix: Add or update the section to say what AI assistance was used and what was reviewed.

  - id: auth-pack
    title: A repo with sign-in has the auth pack (managed provider, abuse defenses, account deletion, threat model)
    level: warn
    label: advisory
    evidence: judgment
    why: Hand-rolled sign-in, unlimited sign-ups and no way to delete an account are common, but whether each one matters depends on the product.
    fix: Add each missing item the finding names, or write the decision record that says why this repo does not need it.

  - id: db-advisory-pack
    title: A repo with a database runs its tests against a real one
    level: warn
    label: advisory
    evidence: judgment
    why: A mock can hide the bug a real database would show, but running one in CI has a cost, so this is a judgment call.
    fix: Add a compose file, testcontainers or `supabase start` for the tests, or decide the mock is enough for this repo.

  - id: deploy-advisory-pack
    title: A hosted app has uptime monitoring, structured logs, a retention note, separate environments, gated deploys and cron heartbeats
    level: warn
    label: advisory
    evidence: judgment
    why: A deployed app with real users needs somebody told when it is down or a job silently stops, but how much of this a small app needs is a judgment call.
    fix: Add each missing item the finding names, or write the decision record that says why this repo does not need it.

  - id: llm-advisory-pack
    title: A repo that calls an LLM versions its prompts, has a model fallback and validates data at the boundary
    level: warn
    label: advisory
    evidence: judgment
    why: A one-prompt prototype can reasonably skip these, but a product with real users cannot trace a bad answer or survive a provider outage without them.
    fix: Add each missing item the finding names, or write the decision record that says why this repo does not need it.

  - id: payments-advisory-pack
    title: A repo that takes payments writes down how webhooks and provider calls are tested
    level: warn
    label: advisory
    evidence: judgment
    why: The tests live where the scanner cannot read, so the evidence is a short record of how they are run.
    fix: Write docs/runbooks/payments-testing.md, or decide the tests need no record.

  - id: db-hygiene-pack
    title: A repo with a database uses a limited role, pools connections and seeds dev with synthetic data
    level: warn
    label: advisory
    evidence: judgment
    why: These are habits whose value depends on the size and shape of the app, so this is a judgment call.
    fix: Add each missing item the finding names, or write the decision record that says why this repo does not need it.

  - id: mail-pack
    title: A repo that sends email records that SPF, DKIM and DMARC pass for its domain
    level: warn
    label: advisory
    evidence: judgment
    why: Mail that lands in spam is silently lost. The records are an external fact, so the note is dated.
    fix: Write docs/gates/email-deliverability.md with a Verified date.

  - id: journal-present
    title: docs/journal.md exists
    level: warn
    label: advisory
    evidence: judgment
    why: A dated record of decisions and dead ends is the evidence that the work happened.
    fix: Run `pow init`, then `pow log` after each decision.

  - id: dependency-updates
    title: Dependabot or Renovate is configured
    level: warn
    label: advisory
    evidence: judgment
    why: Automated update PRs keep known-vulnerable versions from lingering, but they add review work.
    fix: Add `.github/dependabot.yml` or a Renovate config.

  - id: gitignore-present
    title: A .gitignore exists
    level: warn
    label: advisory
    evidence: judgment
    why: Without one, build output, virtualenvs and .env files end up in commits.
    fix: Run `ap standard fix REPO` to scaffold one for the detected ecosystems.

  - id: templates-present
    title: A pull request template and an issue template exist
    level: warn
    label: advisory
    evidence: judgment
    why: A template says what a change needs to show before a reviewer reads it. Whether that helps is unproven.
    fix: Run `ap standard fix REPO`, or add `.github/pull_request_template.md` and `.github/ISSUE_TEMPLATE/`.

  - id: commands-documented
    title: The repo says how to run it (a justfile, or an AGENTS.md `## Commands` section)
    level: warn
    label: advisory
    evidence: judgment
    why: Devbook indexes each repo's own commands, and a person or agent returning after weeks needs them. Without either, the index has nothing for the repo.
    fix: Run `ap standard fix REPO` to scaffold a justfile, then replace the stub recipes with the real commands.

  - id: security-policy
    title: Public repos have a SECURITY.md
    level: warn
    label: advisory
    applies_to: public
    evidence: judgment
    why: It tells a stranger where to report a vulnerability privately instead of in a public issue.
    fix: Add SECURITY.md, or run `ap standard fix REPO`.

  - id: contributing-present
    title: Public repos have a CONTRIBUTING.md
    level: warn
    label: advisory
    applies_to: public
    evidence: judgment
    why: It states what a contributor must run and show. Whether it changes contribution quality is unproven.
    fix: Add CONTRIBUTING.md, or run `ap standard fix REPO`.
